services:
  tracker:
    build: .
    container_name: flight-price-tracker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Uncomment while editing config locally without rebuilding the image:
      # - ./config.yaml:/app/config.yaml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
