# ─────────────────────────────────────────────────────────────────────────────
# Flight Price Tracker — User Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Edit the values below to match your travel plans and alert preferences.
# Secrets (API key, email password) go in .env — NOT here.

# ---------------------------------------------------------------------------
# Alert destination
# ---------------------------------------------------------------------------
alert_email: "recipient@example.com"

# ---------------------------------------------------------------------------
# Price threshold
# ---------------------------------------------------------------------------
# Recibirás una alerta cuando el precio más barato encontrado sea <= este valor (en EUR).
# Este precio es por persona, ida y vuelta, sin equipaje.
price_threshold_usd: 700

# ---------------------------------------------------------------------------
# Fechas de viaje — el tracker probará TODAS las combinaciones posibles
# ---------------------------------------------------------------------------
# Días de salida (desde Tenerife hacia Miami)
outbound_dates:
  - "2026-04-27"
  - "2026-04-28"

# Días de vuelta (desde Miami de vuelta a Tenerife)
return_dates:
  - "2026-05-08"
  - "2026-05-09"

# ---------------------------------------------------------------------------
# Parámetros de búsqueda
# ---------------------------------------------------------------------------
# Origen: Tenerife (busca en TFS y TFN automáticamente)
# Destino: Miami International Airport
origin_airports:
  - "TFS"   # Tenerife Sur — Reina Sofia
  - "TFN"   # Tenerife Norte — Los Rodeos
destination: "MIA"   # Miami International Airport

adults: 1
currency: "EUR"
# Sin equipaje de bodega (solo equipaje de mano)
carry_on_bags: 0
checked_bags: 0

# ---------------------------------------------------------------------------
# Monitorización
# ---------------------------------------------------------------------------
# Intervalo por fuente (en horas). Cada fuente corre en su propio ciclo
# para respetar los límites gratuitos de cada API.
#
#   SerpAPI (Google Flights): 100 llamadas/mes gratis
#     → cada 12h usa ~240/mes (se agota a mitad de mes, luego solo Kiwi/Sky)
#   Kiwi.com: 500 llamadas/mes gratis
#     → cada 60h usa ~96/mes ✅
#   Skyscanner (RapidAPI): ~100 llamadas/mes gratis
#     → cada 72h usa ~80/mes ✅
#
check_interval_hours: 12        # Google Flights (SerpAPI)
kiwi_interval_hours: 60         # Kiwi.com (Tequila API)
skyscanner_interval_hours: 72   # Skyscanner (RapidAPI)

# Máximo de emails de alerta al día para no saturar el buzón.
max_alerts_per_day: 3

# ---------------------------------------------------------------------------
# SMTP — no cambiar si usas Gmail
# ---------------------------------------------------------------------------
smtp_host: "smtp.gmail.com"
smtp_port: 587
