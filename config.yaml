# Flight Price Tracker configuration
#
# Put secrets in .env, not here. This file is meant to be committed and edited
# by each person who wants to track their own routes.

# Email that receives alerts and summaries.
alert_email: "recipient@example.com"

# Alert when a result is equal to or cheaper than this amount in `currency`.
price_threshold: 650
currency: "EUR"

# Route search.
# Use IATA airport codes. You can add one or many origins/destinations.
origins:
  - "MAD"
destinations:
  - "JFK"

# Travel dates. The tracker checks every combination:
# origins x destinations x outbound_dates x return_dates.
outbound_dates:
  - "2026-04-27"
return_dates:
  - "2026-05-08"

# Passengers and bags.
adults: 1
carry_on_bags: 0
checked_bags: 0

# Email behavior.
max_alerts_per_day: 3
send_summary_when_no_alert: true

# Continuous mode intervals, in hours.
# Leave API keys blank in .env to disable a source.
google_interval_hours: 8
kiwi_interval_hours: 60
skyscanner_interval_hours: 72
aviasales_interval_hours: 24

# Sources to run immediately when the app starts in continuous mode.
initial_sources:
  - "google"
  - "aviasales"
